#= Version 1.2.0. Publish verified Obsidian assets for BRAT from a tag or manual run.
name: Release Task2Do
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version confirmation; leave blank to use manifest.json'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: task2do-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publication version
        run: node scripts/verify-release.cjs
      - run: npm run build
      - name: Verify committed bundle matches source
        run: git diff --exit-code -- main.js
      - run: npm run check
      - run: npm test
      - name: Prepare assets and appcast
        run: npm run release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          #= Refuse existing releases, including drafts; never replace shipped assets.
          existing="$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | .tag_name')"
          if grep -Fxq -- "$RELEASE_VERSION" <<< "$existing"; then
            echo "::error::Release already exists. Inspect any failed draft before retrying; use a new version for published changes."
            exit 1
          fi
          #= Manual runs create a tag only after all validation has passed.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            if [[ "$(git rev-list -n 1 "$RELEASE_VERSION")" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag points to another commit."
              exit 1
            fi
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_VERSION" -f "sha=$GITHUB_SHA"
          fi
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" --repo "$REPOSITORY" --verify-tag --draft --title "Task2Do $RELEASE_VERSION" --generate-notes "${flags[@]}"
          gh release upload "$RELEASE_VERSION" release-assets/main.js release-assets/manifest.json release-assets/styles.css release-assets/appcast.json --repo "$REPOSITORY"
          gh release edit "$RELEASE_VERSION" --repo "$REPOSITORY" --draft=false "${flags[@]}"
          echo "Published Task2Do $RELEASE_VERSION: https://github.com/$REPOSITORY/releases/tag/$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
