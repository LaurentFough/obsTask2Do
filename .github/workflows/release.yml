#= Build and publish exact-version GitHub release assets for Obsidian and BRAT.
name: Release Task2Do
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== require("./manifest.json").version) throw Error("Tag must exactly match manifest version, without v prefix")'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Prepare assets and appcast
        run: npm run release
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/main.js release-assets/manifest.json release-assets/styles.css release-assets/appcast.json --repo "$REPOSITORY" --verify-tag --title "Task2Do $RELEASE_TAG" --generate-notes "${flags[@]}"
